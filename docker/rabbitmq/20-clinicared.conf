# RabbitMQ 4.x denies non-durable, non-exclusive ("transient") queues by default.
# Application queues are all durable (src/messaging/topology.py); this permit exists only
# for the Celery remote-control mailbox (<host>.celery.pidbox) used by the Airflow workers.
deprecated_features.permit.transient_nonexcl_queues = true
