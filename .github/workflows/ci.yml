name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch naming & flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming and GitHub-flow targets
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if ! [[ "$HEAD" =~ ^(feat|fix|docs|chore|refactor|test|perf|hotfix)/(US0[1-9]-)?[a-z0-9._-]+$ ]] && [[ "$HEAD" != "develop" ]]; then
            echo "::error::Branch '$HEAD' must match <type>/[USxx-]<kebab-name> (README: Flujo Git)"; exit 1
          fi
          if [[ "$BASE" == "main" && "$HEAD" != "develop" && ! "$HEAD" =~ ^hotfix/ ]]; then
            echo "::error::Only develop or hotfix/* may target main"; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: Trivy filesystem scan (secrets, IaC misconfig, dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig,vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (CA-01..CA-10) with coverage gate
        run: pytest tests/unit -m "not integration" --cov --cov-report=xml
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.xml }

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clinicared_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d clinicared_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg2://ci:ci-only-password@localhost:5432/clinicared_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration -m integration

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements-dev.txt -r requirements-spark.txt
      - run: pytest tests/unit/test_spark_parity.py

  dag-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install Airflow with official constraints
        env:
          AIRFLOW_VERSION: "3.3.2"
          PYTHON_VERSION: "3.13"
        run: |
          pip install -r requirements-airflow.txt -r requirements.txt pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip check
      - name: Validate DAGs (import errors, cycles, conventions)
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: |
          airflow db migrate
          pytest tests/dags

  docker-build:
    needs: [lint, unit-tests, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: clinicared-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinicared-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  airflow-image-build:
    needs: [dag-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Airflow + Spark image (constraints resolution + pip check)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow/Dockerfile
          load: true
          tags: clinicared-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: Runtime smoke test (Airflow, PySpark, Java)
        run: |
          docker run --rm --entrypoint bash clinicared-airflow:ci -c \
            'airflow version && python -c "import pyspark, boto3; print(pyspark.__version__, boto3.__version__)" && spark-submit --version'
